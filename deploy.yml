name: Deploy to Firebase
on:
  push:
    branches: [main]

# අවම අවසර: repo කියවීම පමණි
permissions:
  contents: read

# එකවර deploy දෙකක් ඇති නොවීමට
concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      # Hosting + Firestore rules එකම පියවරෙන්, version එක ස්ථිර කර (latest නොවේ)
      - name: Deploy hosting and Firestore rules
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          umask 077
          echo "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@13 deploy --only hosting,firestore:rules --project ict-census --non-interactive

      # සාර්ථක වුවත් අසාර්ථක වුවත් key ගොනුව මකන්න
      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
