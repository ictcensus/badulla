<style>

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6a7380;--bd:#dde1e7;--ac:#1d5fd1;--acx:#fff;--ok:#1a7f4b;--wa:#b45309;--er:#c0262d;--g1:#f3d36b;--g2:#b8860b;--m-si:#2f6fdb;--m-ta:#1a9a5b;--m-en:#9333c0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1d2127;--tx:#eceff3;--mu:#9aa4b2;--bd:#2e353e;--ac:#5b9bff;--acx:#0b1220;--ok:#4cc38a;--wa:#f0a64a;--er:#ff7b80;--g1:#ffe08a;--g2:#d4a017;--m-si:#5b9bff;--m-ta:#4cc38a;--m-en:#c58cf0}}
:root[data-theme="dark"]{--bg:#14171b;--card:#1d2127;--tx:#eceff3;--mu:#9aa4b2;--bd:#2e353e;--ac:#5b9bff;--acx:#0b1220;--ok:#4cc38a;--wa:#f0a64a;--er:#ff7b80;--g1:#ffe08a;--g2:#d4a017;--m-si:#5b9bff;--m-ta:#4cc38a;--m-en:#c58cf0}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI","Noto Sans Sinhala","Iskoola Pota","Noto Sans Tamil","Latha",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.lang{display:flex;gap:4px}.lang button{padding:6px 12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;font:inherit;font-size:.85rem;cursor:pointer}
.lang button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
h1,h2,h3{display:inline-block;padding-bottom:.28em;background:linear-gradient(90deg,var(--g1),var(--g2)) left bottom/100% 3px no-repeat;line-height:1.25}
h1{font-size:clamp(1.7rem,5vw,2.4rem);margin:8px 0 8px;font-weight:750}h2{font-size:clamp(1.35rem,3.6vw,1.75rem);margin:0 0 14px;font-weight:700}.sub{color:var(--mu);font-size:.9rem;margin:0 0 14px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
label{display:block;font-size:.85rem;color:var(--mu);margin-bottom:4px}
input[type=text],input[type=number],select{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
input:disabled{opacity:.45}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.info{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.92rem}.info b{color:var(--mu);font-weight:500}
.name{font-size:1.1rem;font-weight:650;margin:0 0 8px}
h3{font-size:1.2rem;margin:20px 0 12px;font-weight:650}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.btn{padding:11px 18px;border:0;border-radius:10px;background:var(--ac);color:var(--acx);font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.msg{margin-top:10px;font-size:.92rem}.ok{color:var(--ok)}.er{color:var(--er)}.wa{color:var(--wa)}
.tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:12px}
.tot div{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;text-align:center}
.tot b{display:block;font-size:1.4rem}.tot span{font-size:.78rem;color:var(--mu)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.85rem;min-width:640px}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left}th{color:var(--mu);font-weight:500}td.n,th.n{text-align:right}
.hide{display:none}

.th{padding:6px 11px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;font:inherit;cursor:pointer;margin-left:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}.chips button{padding:6px 12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:999px;font:inherit;font-size:.85rem;cursor:pointer}
.chips button.on{border-color:var(--g2);background:var(--g1);color:#2b2100;font-weight:600}
.mcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:6px}
.mc{text-align:left;padding:14px;border:2px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;cursor:pointer;transition:transform .15s,border-color .15s}
.mc:hover{transform:translateY(-2px)}.mc.on{border-color:var(--g2)}.mc span{font-size:.9rem;color:var(--c);font-weight:600;display:block}
.mc b{display:block;font-size:2rem;line-height:1.2}.mc i{display:block;height:6px;border-radius:3px;background:var(--bd);margin:6px 0;overflow:hidden}.mc u{display:block;height:100%;background:var(--c);transition:width .4s}.mc small{color:var(--mu);font-size:.78rem}
.mx td,.mx th{text-align:right}.mx td:first-child,.mx th:first-child{text-align:left}.mx{min-width:520px}
.mx th.gh{cursor:pointer}.mx th.gh.on{color:var(--tx);box-shadow:inset 0 -3px var(--g2)}.mx tr.on td:first-child{box-shadow:inset 3px 0 var(--g2)}.mx tbody tr{cursor:pointer}
.br{display:grid;grid-template-columns:110px 1fr 46px;gap:8px;align-items:center;margin:7px 0;font-size:.85rem;transition:opacity .2s}.br.dim{opacity:.35}.br b{text-align:right}
.bar{display:flex;height:20px;border-radius:6px;overflow:hidden;background:var(--bd)}.bar i{transition:flex .4s,opacity .2s}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--mu);margin:8px 0}.lg s{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;text-decoration:none}

/* ===== theme upgrade ===== */
:root{--c1:#ff5d8f;--c2:#ff9f1c;--c3:#2ec4b6;--c4:#7b5cff;--c5:#3a86ff;--glow:rgba(243,211,107,.85)}
body{background:radial-gradient(900px 500px at 8% -5%,rgba(123,92,255,.16),transparent 60%),radial-gradient(800px 500px at 100% 0,rgba(255,93,143,.14),transparent 60%),radial-gradient(900px 600px at 50% 110%,rgba(46,196,182,.14),transparent 60%),var(--bg);background-attachment:fixed}
h1,h2,h3{position:relative;background:none!important;padding-bottom:.4em}
h1::after,h2::after,h3::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:3px;border-radius:3px;background:linear-gradient(90deg,#fff3b0,var(--g1),var(--g2),var(--g1),#fff3b0);background-size:200% 100%;box-shadow:0 0 6px 1px var(--glow),0 0 14px 3px rgba(212,160,23,.55),0 0 26px 6px rgba(212,160,23,.25);animation:gl 3s ease-in-out infinite,sh 4s linear infinite}
@keyframes gl{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
@keyframes sh{to{background-position:200% 0}}
.hero{display:flex;align-items:center;gap:18px;padding:18px 20px;margin-bottom:16px;border-radius:18px;color:#fff;background:linear-gradient(120deg,#0b1030,#1b1464 45%,#5b1a8f 75%,#b3195a);background-size:200% 200%;animation:bg 12s ease infinite;border:1px solid rgba(243,211,107,.6);box-shadow:0 0 0 1px rgba(243,211,107,.25),0 8px 30px rgba(91,26,143,.35),0 0 24px rgba(243,211,107,.25)}
@keyframes bg{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
.logo{width:clamp(78px,18vw,120px);height:clamp(78px,18vw,120px);border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 3px rgba(243,211,107,.9),0 0 22px 4px rgba(243,211,107,.55)}
.hero h1{color:#fff;margin:0 0 6px;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.hero .sub{color:#e6e2ff;margin:0}
.top{display:block}
.lang{margin:0 0 14px;flex-wrap:wrap}
.lang button,.th{transition:all .2s}
.lang button:hover,.th:hover{border-color:var(--c4);transform:translateY(-1px)}
.lang button.on,.tabs button.on{background:linear-gradient(135deg,var(--c4),var(--c1));color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(123,92,255,.4)}
.tabs button{font-weight:600;transition:all .2s}.tabs button:hover{border-color:var(--c4)}
.btn{background:linear-gradient(135deg,var(--c5),var(--c4) 55%,var(--c1));color:#fff;box-shadow:0 4px 14px rgba(123,92,255,.35);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(255,93,143,.4)}
.btn.sec{background:transparent;color:var(--c4);border:1px solid var(--c4);box-shadow:none}
.card{border:1px solid var(--bd);border-top:4px solid var(--c4);box-shadow:0 6px 22px rgba(60,40,140,.08)}
#v1>.card:nth-child(1){border-top-color:var(--c5)}#form{border-top-color:var(--c1)}
#v2>.card:nth-child(1){border-top-color:var(--c3)}#v2>.card:nth-child(2){border-top-color:var(--c2)}#v2>.card:nth-child(3){border-top-color:var(--c4)}
input[type=text],input[type=number],select{transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{outline:0;border-color:var(--c4);box-shadow:0 0 0 3px rgba(123,92,255,.25)}
.tot div:nth-child(5n+1){background:linear-gradient(135deg,rgba(58,134,255,.18),transparent)}.tot div:nth-child(5n+2){background:linear-gradient(135deg,rgba(46,196,182,.2),transparent)}.tot div:nth-child(5n+3){background:linear-gradient(135deg,rgba(255,159,28,.2),transparent)}.tot div:nth-child(5n+4){background:linear-gradient(135deg,rgba(255,93,143,.18),transparent)}.tot div:nth-child(5n){background:linear-gradient(135deg,rgba(123,92,255,.2),transparent)}
.tot b{background:linear-gradient(90deg,var(--c4),var(--c1));-webkit-background-clip:text;background-clip:text;color:transparent}
.mc{background:linear-gradient(145deg,var(--bg),color-mix(in srgb,var(--c) 14%,var(--bg)))}.mc.on{box-shadow:0 0 14px var(--glow)}
th{background:linear-gradient(90deg,rgba(123,92,255,.12),rgba(255,93,143,.1));color:var(--tx);font-weight:600}
tbody tr:hover td{background:rgba(123,92,255,.07)}
.chips button:hover{border-color:var(--c3)}
.chips button.on{box-shadow:0 0 10px var(--glow)}
.info b{color:var(--c4)}
@media(max-width:520px){.hero{gap:12px;padding:14px}}

.office{display:block;margin:0 0 12px;padding-bottom:.55em;color:#fff;font-weight:700;line-height:1.35}
.office span{display:block}
.office .o-si{font-size:clamp(1.25rem,4.2vw,1.9rem);background:linear-gradient(90deg,#fff3b0,#f3d36b,#ffb4d1);-webkit-background-clip:text;background-clip:text;color:transparent}
.office .o-ta{font-size:clamp(1.05rem,3.4vw,1.5rem);color:#bff5ee}
.office .o-en{font-size:clamp(.85rem,2.6vw,1.1rem);color:#e6e2ff;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.hero h1{font-size:clamp(1.2rem,3.6vw,1.7rem)}

body,button,input,select{font-family:"Poppins","Noto Sans Sinhala","Noto Sans Tamil",system-ui,-apple-system,"Segoe UI","Iskoola Pota","Latha",Roboto,sans-serif}
h1,h2,h3,.name,.tabs button,.btn,.mc b,.tot b{font-family:"Poppins","Noto Sans Sinhala","Noto Sans Tamil",system-ui,sans-serif;letter-spacing:-.01em}

#eq{min-width:0}#eq input{max-width:120px}.mc{cursor:default}.mc:hover{transform:none}.br span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.br{grid-template-columns:150px 1fr 36px}


main{max-width:1100px}.mu{color:var(--mu)}.back{margin-bottom:12px}
tr.clk{cursor:pointer}#dbT{min-width:1350px;font-size:.8rem}#dbT td.s{white-space:nowrap}
.bdg{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.78rem;border:1px solid var(--bd);margin:0 6px 4px 0}.bdg.ok{border-color:var(--ok);color:var(--ok)}
#fL{border-top-color:var(--c1)}#fS{border-top-color:var(--c3)}.hint{font-size:.82rem;color:var(--mu);margin:0 0 8px}
.tabs.in{margin-top:4px}

.tabs.in{flex-wrap:wrap}.tabs.in button{min-width:120px}.it{border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--bg)}
.ith{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.sm{padding:5px 10px;font-size:.8rem}.wide{grid-column:1/-1}
.gc{display:inline-flex;gap:4px;align-items:center;margin:0 10px 6px 0;color:var(--tx);font-size:.9rem}#lc input[type=text]{margin-top:4px}
